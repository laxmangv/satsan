<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schedule Appointment</title>

    <link rel="stylesheet" href="Style.css">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>

.appointment-section{
    padding:80px 8%;
    background:#91b3d85a;
}

.appointment-container{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:80px;
    flex-wrap:wrap;
}

/* Left Side */

.form-content{
    flex:1;
    min-width:420px;
}

.form-content h4{
    color:#07357a;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:15px;
    margin-bottom:15px;
}

.form-content h1{
    font-size:58px;
    color:#043174;
    line-height:1.1;
    margin-bottom:20px;
    font-family:Arial,sans-serif;
    font-style:italic;
}

.form-content p{
    font-size:18px;
    line-height:1.8;
    color:#666;
    margin-bottom:40px;
    max-width:600px;
}

/* Card */

.form-card{
    background:white;
    padding:45px;
    border-radius:25px;
    box-shadow:0 18px 50px rgba(0,0,0,.08);
}

/* Form */

.appointment-form{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.appointment-form input,
.appointment-form select,
.appointment-form textarea{
    width:100%;
    padding:18px 22px;
    border:none;
    border-radius:14px;
    background:white;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
    font-size:16px;
    transition:.3s;
    box-sizing:border-box;
}

.appointment-form input:focus,
.appointment-form select:focus,
.appointment-form textarea:focus{
    outline:none;
    box-shadow:0 0 0 2px #1f4f95;
}

.appointment-form textarea{
    height:160px;
    resize:none;
}

.row{
    display:flex;
    gap:20px;
}

.row input,
.row select{
    flex:1;
}

.submit-btn{
    width:220px;
    padding:17px;
    border:none;
    border-radius:12px;
    background:#1f4f95;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    background:#163a70;
    transform:translateY(-3px);
}

/* Right Side */

.form-image{
    flex:1;
    text-align:center;
    min-width:400px;
}

.form-image img{
    width:100%;
    max-width:580px;
}

/* Placeholder */

::placeholder{
    color:#999;
}

/* Responsive */

@media(max-width:950px){

    .appointment-container{
        flex-direction:column-reverse;
    }

    .form-content h1{
        font-size:46px;
    }

    .form-image img{
        max-width:450px;
    }

    .row{
        flex-direction:column;
    }

    .submit-btn{
        width:100%;
    }

}

    </style>

</head>

<body>

<nav>

<div class="logo">
    <img src="logo.png" alt="Logo">
</div>

<div class="nav-links">
    <a href="index.html">Home</a>
    <a href="About Us.html">About Us</a>
    <a href="Services.html">Services</a>
    <a href="Products.html">Products</a>
    <a href="Contact Us.html">Contact Us</a>
</div>

</nav>

<section class="appointment-section">

<div class="appointment-container">

<div class="form-content">

<h4>Schedule a Consultation</h4>

<h1>Let's Build Your Financial Future.</h1>

<p>
Fill in your details and our advisors will reach out to understand your goals and help you choose the right financial solutions.
</p>

<div class="form-card">

<form id="appointmentForm" class="appointment-form">

<input
type="text"
name="name"
placeholder="Full Name"
required>

<div class="row">

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="tel"
name="phone"
placeholder="Phone Number"
required>

</div>

<select
name="service"
required>

<option value="">Select a Service</option>
<option>NCDs</option>
<option>Insurance</option>
<option>Mutual Funds</option>
<option>FIRE Planning</option>

</select>

<textarea
name="message"
placeholder="Tell us how we can help..."></textarea>

<button
type="submit"
class="submit-btn">
Schedule Appointment
</button>

</form>

</div>

</div>

<div class="form-image">
<img src="appointmentimg.png" alt="">
</div>

</div>

</section>

<script>

emailjs.init("a4C8pl1yAhfT21n_B");

document.getElementById("appointmentForm").addEventListener("submit", function(event){

event.preventDefault();

emailjs.sendForm(

"service_rey8h7u",

"template_1kecdfp",

this

)

.then(() => {

alert("Thank you for your request! Our team will reach out to you shortly!");

this.reset();

})

.catch((error) => {

console.log(error);

alert("Something went wrong. Please try again.");

});

});

</script>

</body>
<footer>
     © 2026 SatSan Capital. All Rights Reserved.
  </footer>

</html>
